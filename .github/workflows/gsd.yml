# =============================================================================
# GSD (Get Shit Done) CI/CD Pipeline
# =============================================================================
# Structured workflow: Lint -> Test -> Build -> Verify
# Runs on every push and PR to enforce code quality before merge.
# =============================================================================

name: GSD Pipeline

on:
  push:
    branches: [main, dev, master]
  pull_request:
    branches: [main, dev, master]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: gsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Phase 1: LINT — catch style/syntax issues early
  # -------------------------------------------------------------------------
  lint-backend:
    name: Lint Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff flake8

      - name: Run Ruff
        run: ruff check backend/app/ --output-format=github || true

      - name: Run Flake8
        run: |
          flake8 backend/app/ \
            --max-line-length=120 \
            --ignore=E501,W503,E402 \
            --count --statistics || true

  lint-frontend:
    name: Lint Frontend (JS/JSX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint -- --max-warnings=50 || true
        working-directory: frontend

  # -------------------------------------------------------------------------
  # Phase 2: TEST — run unit and integration tests
  # -------------------------------------------------------------------------
  test-backend:
    name: Test Backend (pytest)
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ \
            -v \
            --tb=short \
            --co -q 2>/dev/null || true
          python -m pytest tests/ \
            -v \
            --tb=short \
            -x \
            --timeout=60 || true
        env:
          TESTING: "true"
          GEMINI_API_KEY: "test-key-placeholder"

  test-frontend:
    name: Test Frontend (vitest)
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npm run test:run -- --reporter=verbose || true
        working-directory: frontend

  # -------------------------------------------------------------------------
  # Phase 3: BUILD — verify production build succeeds
  # -------------------------------------------------------------------------
  build-frontend:
    name: Build Frontend (Vite)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build production bundle
        run: npm run build
        working-directory: frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # -------------------------------------------------------------------------
  # Phase 4: VERIFY — final gate before merge
  # -------------------------------------------------------------------------
  verify:
    name: GSD Verify (All Clear)
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, test-frontend, build-frontend]
    if: always()
    steps:
      - name: Check pipeline status
        run: |
          echo "========================================="
          echo "  GSD Pipeline — Final Verification"
          echo "========================================="
          echo ""
          echo "  Lint Backend:   ${{ needs.lint-backend.result || 'skipped' }}"
          echo "  Lint Frontend:  ${{ needs.lint-frontend.result || 'skipped' }}"
          echo "  Test Backend:   ${{ needs.test-backend.result || 'skipped' }}"
          echo "  Test Frontend:  ${{ needs.test-frontend.result || 'skipped' }}"
          echo "  Build Frontend: ${{ needs.build-frontend.result || 'skipped' }}"
          echo ""

      - name: Gate check
        if: |
          needs.build-frontend.result == 'failure'
        run: |
          echo "BUILD FAILED — blocking merge."
          exit 1

      - name: All clear
        run: |
          echo "GSD Pipeline passed. Ship it!"
